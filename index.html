<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Font Attention maps recorded Qwen3 transformer attention to variable typography in a typewriter-inspired interactive page." />
    <meta name="theme-color" content="#fcfbf8" />
    <title>Font Attention — language model attention as typography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Cutive+Mono&family=DM+Mono:wght@300;400;500&family=Reenie+Beanie&family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Font Attention home">FONT/<span>ATTENTION</span></a>
        <p>Language model attention<br />as a typographic instrument.</p>
        <a class="source-link" href="https://github.com/Boning1011/font-attention" target="_blank" rel="noreferrer">SOURCE ↗</a>
      </header>
      <main>
        <section class="stage" aria-label="Attention visualization">
          <div class="stage-meta"><span>01 / LIVE REPLAY</span><span id="model-label">LOADING QWEN DATA…</span></div>
          <svg id="attention-arcs" class="attention-arcs" aria-hidden="true"></svg>
          <div id="text-canvas" class="text-canvas" aria-live="polite"></div>
          <svg id="attention-marks" class="attention-marks" aria-hidden="true"></svg>
          <aside id="margin-notes" class="margin-notes" aria-label="Strongest token links">
            <h2>Strongest token links:</h2>
            <div id="margin-link-list"></div>
          </aside>
          <div class="transport">
            <button id="play-toggle" class="transport-button" type="button" aria-label="Pause replay">PAUSE</button>
            <button id="restart" class="transport-button secondary" type="button">RESTART</button>
            <label class="timeline-wrap"><span class="sr-only">Replay position</span><input id="timeline" type="range" min="0" max="1" value="0" step="1" /></label>
            <output id="counter">00 / 00</output>
            <button id="speed" class="speed-button" type="button" aria-label="Change replay speed">1×</button>
          </div>
        </section>
        <aside class="inspector" aria-label="Display settings">
          <div class="inspector-heading"><span>02 / SETTINGS</span><span class="live-dot">LIVE</span></div>
          <label class="font-panel">
            <span class="eyebrow">TYPE INTERFACE</span>
            <select id="font-select" aria-label="Visualization typeface">
              <option value="mixed">Typewriter Mixed Case</option>
              <option value="special-elite">Special Elite</option>
              <option value="courier-prime">Courier Prime</option>
              <option value="cutive-mono">Cutive Mono</option>
            </select>
          </label>
          <div class="tuning-panel">
            <span class="eyebrow">MAPPING EFFECT</span>
            <label class="mapping-select"><span>MAPPING</span><select id="mapping-select" aria-label="Attention mapping preset">
              <option value="balanced">Balanced</option>
              <option value="weight">Weight led</option>
              <option value="width">Width led</option>
              <option value="italic">Italic pulse</option>
              <option value="optical">Optical contrast</option>
            </select></label>
          </div>
        </aside>
      </main>
      <footer><span>QWEN3 / SELF-ATTENTION</span><span>ATTENTION → TYPOGRAPHIC AXES</span><span>BONING LI, 2026</span></footer>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
